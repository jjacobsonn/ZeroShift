version: '3.8'

services:
  blue:
    image: ghcr.io/jjacobsonn/zeroshift/blue:latest
    container_name: zeroshift-blue
    ports:
      - "8081:8080"
    environment:
      - ENV=blue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  green:
    image: ghcr.io/jjacobsonn/zeroshift/green:latest
    container_name: zeroshift-green
    ports:
      - "8082:8080"
    environment:
      - ENV=green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  proxy:
    image: ghcr.io/jjacobsonn/zeroshift/proxy:latest
    container_name: zeroshift-proxy
    ports:
      - "80:80"
    depends_on:
      - blue
      - green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped 