version: '3.8'

services:
  # Blue environment (currently live)
  blue:
    build:
      context: ../blue
      dockerfile: Dockerfile
    container_name: zeroshift-blue
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    networks:
      - zeroshift-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "com.zeroshift.environment=blue"
      - "com.zeroshift.version=1.0.0"

  # Green environment (staging)
  green:
    build:
      context: ../green
      dockerfile: Dockerfile
    container_name: zeroshift-green
    environment:
      - PORT=8082
    ports:
      - "8082:8082"
    networks:
      - zeroshift-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "com.zeroshift.environment=green"
      - "com.zeroshift.version=1.0.0"

  # Nginx reverse proxy
  proxy:
    build:
      context: ../proxy
      dockerfile: Dockerfile
    container_name: zeroshift-proxy
    ports:
      - "80:80"
    networks:
      - zeroshift-network
    depends_on:
      blue:
        condition: service_healthy
      green:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    volumes:
      - ./live.txt:/etc/nginx/live.txt:ro
    labels:
      - "com.zeroshift.service=proxy"

networks:
  zeroshift-network:
    driver: bridge
    name: zeroshift-network 