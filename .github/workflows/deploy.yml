name: ZeroShift Blue-Green Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}

jobs:
  # Test and build stage
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true
        
    - name: Run tests for Blue service
      working-directory: ./blue
      run: |
        go mod tidy
        go test -v ./...
        
    - name: Run tests for Green service
      working-directory: ./green
      run: |
        go mod tidy
        go test -v ./...
        
    - name: Build Blue Docker image
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        docker build -t $REGISTRY/$IMAGE_NAME/blue:$SHORT_SHA ./blue
        docker build -t $REGISTRY/$IMAGE_NAME/blue:latest ./blue
        
    - name: Build Green Docker image
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        docker build -t $REGISTRY/$IMAGE_NAME/green:$SHORT_SHA ./green
        docker build -t $REGISTRY/$IMAGE_NAME/green:latest ./green
        
    - name: Build Proxy Docker image
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        docker build -t $REGISTRY/$IMAGE_NAME/proxy:$SHORT_SHA ./proxy
        docker build -t $REGISTRY/$IMAGE_NAME/proxy:latest ./proxy

  # Security scan stage
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test-and-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        
  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker images
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        docker build -t $REGISTRY/$IMAGE_NAME/blue:$SHORT_SHA -t $REGISTRY/$IMAGE_NAME/blue:latest ./blue
        docker build -t $REGISTRY/$IMAGE_NAME/green:$SHORT_SHA -t $REGISTRY/$IMAGE_NAME/green:latest ./green
        docker build -t $REGISTRY/$IMAGE_NAME/proxy:$SHORT_SHA -t $REGISTRY/$IMAGE_NAME/proxy:latest ./proxy
      
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Push Docker images
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        docker push $REGISTRY/$IMAGE_NAME/blue:$SHORT_SHA
        docker push $REGISTRY/$IMAGE_NAME/blue:latest
        docker push $REGISTRY/$IMAGE_NAME/green:$SHORT_SHA
        docker push $REGISTRY/$IMAGE_NAME/green:latest
        docker push $REGISTRY/$IMAGE_NAME/proxy:$SHORT_SHA
        docker push $REGISTRY/$IMAGE_NAME/proxy:latest
        
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Update deployment files
          cd /opt/zeroshift
          
          # Get short SHA
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          # Pull latest images
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/blue:$SHORT_SHA
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/green:$SHORT_SHA
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:$SHORT_SHA
          
          # Update docker-compose.yml with new image tags
          sed -i "s|image:.*blue.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/blue:$SHORT_SHA|g" docker-compose.yml
          sed -i "s|image:.*green.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/green:$SHORT_SHA|g" docker-compose.yml
          sed -i "s|image:.*proxy.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:$SHORT_SHA|g" docker-compose.yml
          
          # Deploy green environment (staging)
          docker-compose up -d green
          
          # Wait for green to be healthy
          echo "Waiting for green environment to be healthy..."
          timeout 60 bash -c 'until curl -f http://localhost:8082/health; do sleep 2; done'
          
          # Switch traffic to green
          ./switch.sh green
          
          echo "Staging deployment completed successfully"

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker images
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        docker build -t $REGISTRY/$IMAGE_NAME/blue:$SHORT_SHA -t $REGISTRY/$IMAGE_NAME/blue:latest ./blue
        docker build -t $REGISTRY/$IMAGE_NAME/green:$SHORT_SHA -t $REGISTRY/$IMAGE_NAME/green:latest ./green
        docker build -t $REGISTRY/$IMAGE_NAME/proxy:$SHORT_SHA -t $REGISTRY/$IMAGE_NAME/proxy:latest ./proxy
      
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Push Docker images
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        docker push $REGISTRY/$IMAGE_NAME/blue:$SHORT_SHA
        docker push $REGISTRY/$IMAGE_NAME/blue:latest
        docker push $REGISTRY/$IMAGE_NAME/green:$SHORT_SHA
        docker push $REGISTRY/$IMAGE_NAME/green:latest
        docker push $REGISTRY/$IMAGE_NAME/proxy:$SHORT_SHA
        docker push $REGISTRY/$IMAGE_NAME/proxy:latest
        
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Update deployment files
          cd /opt/zeroshift
          
          # Get short SHA
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          # Pull latest images
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/blue:$SHORT_SHA
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/green:$SHORT_SHA
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:$SHORT_SHA
          
          # Update docker-compose.yml with new image tags
          sed -i "s|image:.*blue.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/blue:$SHORT_SHA|g" docker-compose.yml
          sed -i "s|image:.*green.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/green:$SHORT_SHA|g" docker-compose.yml
          sed -i "s|image:.*proxy.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:$SHORT_SHA|g" docker-compose.yml
          
          # Determine current live environment
          CURRENT_LIVE=$(cat live.txt)
          
          if [ "$CURRENT_LIVE" = "blue" ]; then
            # Deploy to green (staging)
            echo "Deploying to green environment..."
            docker-compose up -d green
            
            # Wait for green to be healthy
            echo "Waiting for green environment to be healthy..."
            timeout 60 bash -c 'until curl -f http://localhost:8082/health; do sleep 2; done'
            
            # Switch traffic to green
            ./switch.sh green
            
            # Optional: Stop old blue environment after successful switch
            sleep 10
            docker-compose stop blue
            docker-compose rm -f blue
            
          else
            # Deploy to blue (staging)
            echo "Deploying to blue environment..."
            docker-compose up -d blue
            
            # Wait for blue to be healthy
            echo "Waiting for blue environment to be healthy..."
            timeout 60 bash -c 'until curl -f http://localhost:8081/health; do sleep 2; done'
            
            # Switch traffic to blue
            ./switch.sh blue
            
            # Optional: Stop old green environment after successful switch
            sleep 10
            docker-compose stop green
            docker-compose rm -f green
          fi
          
          echo "Production deployment completed successfully"
          
    - name: Notify deployment success
      if: success()
      run: |
        echo "Production deployment successful!"
        echo "Commit: ${{ github.sha }}"
        echo "Deployed by: ${{ github.actor }}"
        
    - name: Notify deployment failure
      if: failure()
      run: |
        echo "Production deployment failed!"
        echo "Commit: ${{ github.sha }}"
        echo "Deployed by: ${{ github.actor }}"

  # Rollback job (manual trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Rollback on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/zeroshift
          
          # Get current live environment
          CURRENT_LIVE=$(cat live.txt)
          
          if [ "$CURRENT_LIVE" = "blue" ]; then
            echo "Rolling back to blue environment..."
            ./switch.sh blue
          else
            echo "Rolling back to green environment..."
            ./switch.sh green
          fi
          
          echo "Rollback completed successfully" 